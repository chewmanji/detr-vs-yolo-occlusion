[project]
name = "detr-vs-yolo-occlusion"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pycocotools>=2.0.11",
    "rfdetr>=1.11.2",
    "ultralytics>=8.4.201",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, and type hints required on every function
select = ["E", "W", "F", "I", "B", "UP", "ANN"]

[tool.pyright]
# Pylance reads this too, so the editor and `uv run pyright` report the same errors
include = ["scripts"]
typeCheckingMode = "standard"
